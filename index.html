<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>world.execute(me); · 鲸鱼娘</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
      #stage { display: block; width: 100vw; height: 100vh; cursor: none; }

      /* 控制条 */
      #controls {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(8px);
        display: flex; align-items: center; gap: 10px; z-index: 10;
        padding: 8px 14px; border-radius: 10px;
        background: rgba(12,14,18,0.82); border: 1px solid #2c2f38;
        color: #e8eaee; font: 500 13px "JetBrains Mono", monospace;
        opacity: 0; transition: opacity .22s ease, transform .22s ease; pointer-events: none;
      }
      #controls.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
      #controls button {
        background: #1e2026; color: #e8eaee; border: 1px solid #3a3f4b; border-radius: 6px;
        padding: 4px 10px; font: 600 13px "JetBrains Mono", monospace; cursor: pointer;
      }
      #controls button:hover { border-color: #00e5ff; color: #00e5ff; }
      #controls input[type=range] { width: 320px; accent-color: #00e5ff; }
      #controls .tc { color: #b8bcc4; min-width: 92px; }

      /* 起始遮罩 */
      #start {
        position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
        background: rgba(6,7,10,0.86); color: #e8eaee; cursor: pointer;
        font: 600 20px "JetBrains Mono", "Microsoft YaHei", monospace; letter-spacing: .06em;
      }

      /* ?debug 面板 */
      #debug {
        position: fixed; left: 12px; top: 12px; z-index: 20; max-width: min(1000px, 62vw);
        padding: 10px 12px; border-radius: 8px; background: rgba(10,12,16,0.86);
        border: 1px solid #2c2f38; color: #b8bcc4; font: 500 12px "JetBrains Mono", monospace;
        display: flex; flex-direction: column; gap: 6px;
      }
      #debug .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      #debug b { color: #00e5ff; }
      #debug label { display: flex; align-items: center; gap: 4px; }
      #debug .hint { color: #6b7280; }
      #debug .jumps button {
        background: #1a1c22; color: #b8bcc4; border: 1px solid #33383f; border-radius: 4px;
        padding: 2px 6px; font: 500 11px "JetBrains Mono", monospace; cursor: pointer;
      }
      #debug .jumps button:hover { border-color: #00e5ff; color: #00e5ff; }
      #debug input[type=range] { width: 960px; max-width: 100%; accent-color: #00e5ff; }
      #debug [data-role=stat] { color: #a5e075; }

      /* ?selftest 输出 */
      #selftest {
        position: fixed; right: 12px; top: 12px; z-index: 30; margin: 0;
        max-width: 46vw; max-height: 74vh; overflow: auto;
        padding: 10px 12px; border-radius: 8px; background: rgba(8,10,14,0.9);
        border: 1px solid #2c2f38; color: #e8eaee; font: 500 12px/1.55 "JetBrains Mono", monospace;
        white-space: pre-wrap;
      }
      #selftest::first-line { color: #00e5ff; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
